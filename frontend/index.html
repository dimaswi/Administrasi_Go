<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link id="app-favicon" rel="icon" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIMKEP</title>
  <script>
    (function () {
      try {
        var cachedIcon = localStorage.getItem('app_icon');
        if (cachedIcon) {
          var link = document.getElementById('app-favicon') || document.querySelector("link[rel*='icon']");
          if (link) {
            link.href = cachedIcon;
            link.removeAttribute('type');
          }
        }
        var cachedTitle = localStorage.getItem('app_name');
        if (cachedTitle) {
          document.title = cachedTitle;
        }
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
